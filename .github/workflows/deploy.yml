name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build static site
        run: npm run build

      - name: Deploy primary site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a6994724dee43ad653a354f301081ed9
        run: >-
          npx --yes wrangler@4.129.0 pages deploy dist
          --project-name vikramchopra-site
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "Deploy $GITHUB_SHA from GitHub Actions"
          --commit-dirty=false

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-edge-router:
    runs-on: ubuntu-latest
    needs:
      - deploy-cloudflare
      - deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test automatic failover
        run: npm run test:edge-router

      - name: Deploy edge router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a6994724dee43ad653a354f301081ed9
        run: npx --yes wrangler@4.129.0 deploy

      - name: Verify live primary and automatic failover
        env:
          EDGE_FAILOVER_TEST_TOKEN: ${{ secrets.EDGE_FAILOVER_TEST_TOKEN }}
        run: npm run verify:edge-router
